<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background: #2A7B9B;
            background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            height: 550px;
            width: 360px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            background-color: white;
            align-items: center ;
            gap: 25px;
        }
        .card img{
            height: 30%;
            width: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .text{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 70%;
            text-align: center;
        }
        .amountbox{
            height: 45px;
            width: 82%;
            background-color: rgb(166, 166, 157);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 20px;
            padding-left: 10px;
        }
        .left{
            width: fit-content;
            height: 100%;
            display: flex;
            gap: 15px;
            align-items: center;

        }
        .image img{
            height: 50px;
            width: 50px;
        }
        #payment{
            width: 82%;
            height: 9%;
            background-color: darkblue;
            color: white;
            font-size: large;
            
            border-radius: 20px;
            /* -webkit-box-shadow: 0px 0px 15px 0px rgba(0,0,0,0.73);  */
            box-shadow: 0px 0px 15px 0px rgba(0,0,0,0.73);
        }
        .cancelorder a{
            text-decoration: none;
            color:rgb(68, 70, 72);
            font-size: large;
            font-weight: bold;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="randomphoto.webp" alt="">
            <div class="text">
                <h2>ORDER SUMMARY</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laudantium voluptatibus corporis ducimus obcaecati magnam vitae alias id voluptatem numquam commodi.</p>
            </div>
            <div class="amountbox">
                <div class="left">
                    <div class="image">
                        <img src="googlelogo copy.png" alt="">
                    </div>
                    <div class="amount">
                        <p>Amount</p>
                        <p>$79.99/year</p>
                    </div>
                </div>
                <div class="right">
                    <a href="#">Change</a>
                </div>
            </div>
            
            <button id="payment">
                Proceed to Payment
            </button>
            
            <div class="cancelorder">
                <a href="#">Cancel Order</a>
            </div>
            
        </div>
    </div>
</body>
</html>
