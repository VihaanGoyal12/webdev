<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            width: 100%;
            height: 100%;
            display: grid;
            gap: 1rem;
            padding: 4rem;
            background-color: #484444;
        }
        .items{
            background-color: #9033c2;
            padding: 1rem;
            border: 1px solid black;
            color: white;
            

        }
        #h{
            grid-area: header;
        }
        #s{
            grid-area: sidebar;

        }
        #c1{
            grid-area: content1;
        }
        #c2{
            grid-area: content2;
        }
        #c3{
            grid-area: content3;
        }
        #F{
            grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="h">h</div>
        <div class="items" id="s">s</div>
        <div class="items" id="c1">c1</div>
        <div class="items" id="c2">c2</div>
        <div class="items" id="c3">c3</div>
        <div class="items" id="c4">F</div>
        
    </div>
</body>
</html>
