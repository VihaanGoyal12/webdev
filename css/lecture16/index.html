<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            padding: 5rem;
            background-color: wheat;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 1rem;
        }
        .items{
            padding: 2rem;
            height: 150px;
            width: 150px;
            background-color: rgb(95, 95, 181);
            border: 2px solid black;
            /* transition: ; */
        }
        #rx:hover{
            transform: rotateX(45deg);
        }
        #ry:hover{
            transform: rotateY(45deg);
        }
        #rz:hover{
            transform:perspective(300px) rotateZ(45deg);
        }
        #tx:hover{
            transform: translateX(100px);
        }
        #ty:hover{
            transform:translateY(100px);
        }
        #tz:hover{
            transform:perspective(200px) translateZ(100px);
        }
        #sx:hover{
            transform: scaleX(1.5);
        }
        #sy:hover{
            transform:scaleY(1.5);
        }
        #sz:hover{
            transform:perspective(300px) scaleZ(1.5) rotateY(30deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="rx">rx</div>
        <div class="items" id="ry">ry</div>
        <div class="items" id="rz">rz</div>
        <div class="items" id="sx">sx</div>
        <div class="items" id="sy">sy</div>
        <div class="items" id="sz">sz</div>
        <div class="items" id="tx">tx</div>
        <div class="items" id="ty">ty</div>
        <div class="items" id="tz">tz</div>
    </div>
</body>
</html>
